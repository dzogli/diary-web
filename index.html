<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2e9e4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https:; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Мой дневник</title>
<style>
:root{--bg:#eef3f0;--panel:#fff;--side:#f7faf8;--tx:#1d2a21;--mu:#6c7f72;--ac:#2e9e4f;--ac2:#e2f4e8;--bd:#dde7e0;--star:#f5a623;--red:#d93025;--sh:0 1px 2px rgba(20,40,28,.05),0 6px 18px rgba(20,40,28,.06)}
@media (prefers-color-scheme:dark){.d.ok{background:#1f4a2c;color:#bdf0cb}.d.wait{background:#5a4510;color:#ffe08a}.d.late{background:#5c2420;color:#ffb8b0}.legend .lg::before{background:#1f4a2c}.legend .ly::before{background:#5a4510}.legend .lr::before{background:#5c2420}}
@media (prefers-color-scheme:dark){:root{--bg:#0e1511;--panel:#17211b;--side:#121a15;--tx:#e7f1ea;--mu:#8ea496;--ac:#4cc474;--ac2:#1f3a29;--bd:#25352b;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15.5px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx)}
#app{display:flex;height:100vh}
/* боковая панель */
#side{width:290px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.sbrand{display:flex;align-items:center;gap:10px;padding:18px 18px 8px;font-size:18px;color:var(--ac)}
.sbrand .logo{font-size:26px}
.search{position:relative;margin:8px 14px 10px}
.search input{width:100%;border:1px solid var(--bd);background:var(--panel);border-radius:12px;padding:9px 34px 9px 34px}
.search input:focus{outline:2px solid var(--ac);border-color:transparent}
.search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--mu);padding:4px 8px}
.sscroll{flex:1;overflow:auto;padding:0 10px 8px;min-height:0}
.sdiv{height:1px;background:var(--bd);margin:8px 6px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:10px;text-align:left}
.sitem:hover{background:var(--ac2)}
.sitem.on{background:var(--ac2);font-weight:600;box-shadow:inset 3px 0 0 var(--ac)}
.sitem .ic{width:22px;text-align:center;flex:none}
.sitem .sn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .cnt{font-size:12px;color:var(--mu)}
.sfoot{padding:8px 10px 12px;border-top:1px solid var(--bd)}
.newl{display:flex;gap:8px;padding:4px 6px}
.newl input{flex:1;min-width:0;border:1px solid var(--bd);border-radius:10px;padding:7px 10px;background:var(--panel)}
/* основная область */
#main{flex:1;min-width:0;overflow:auto;padding:26px clamp(16px,4vw,48px) 60px;background:linear-gradient(180deg,var(--ac2) 0,transparent 230px),var(--bg);container-type:inline-size}
.page,#settings,#v-diary{max-width:880px;margin:0 auto}
.mbar{display:none;align-items:center;gap:10px;margin-bottom:14px;font-weight:600}
.mbar button{font-size:22px;padding:2px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--bd)}
.phead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.phead .pico{font-size:34px}
.hgrow{flex:1;min-width:0}
.ptitle{margin:0;font-size:30px;letter-spacing:-.4px;line-height:1.15;cursor:default}
.phead .ei{font-size:26px;font-weight:700;width:100%;border:1px solid var(--ac);border-radius:10px;padding:2px 8px;background:var(--panel)}
.psub{color:var(--mu);font-size:14px}
.psub::first-letter{text-transform:uppercase}
.errb{background:var(--panel);border:1px solid var(--red);color:var(--red);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.pb{height:8px;background:var(--ac2);border-radius:99px;overflow:hidden;margin:0 0 16px}
.pf{height:100%;background:var(--ac);border-radius:99px;transition:width .25s}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.lbl{font-weight:600;margin-bottom:8px}
#dl::first-letter{text-transform:uppercase}
.hint{font-size:13px;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:46px 10px}
.empty .big{font-size:46px;margin-bottom:6px}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:4px}
/* добавление задач */
.addbar{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:5px 8px 5px 12px;box-shadow:var(--sh);margin-bottom:16px}
.addbar .plus{color:var(--ac);font-size:22px;line-height:1}
.addbar input[type=text]{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:10px 4px}
.addbar input[type=text]:focus{outline:0}
.addbar:focus-within{border-color:var(--ac)}
.mini{display:flex;align-items:center;gap:8px;padding:6px 0}
.mini input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--bd);background:transparent;padding:6px 2px}
.mini input:focus{outline:0;border-bottom-color:var(--ac)}
.mini .plus{color:var(--ac)}
input[type=date]{border:1px solid var(--bd);border-radius:10px;padding:5px 8px;background:var(--panel)}
.b{border:1px solid var(--ac);color:var(--ac);border-radius:10px;padding:8px 14px;background:transparent}
.b:hover{background:var(--ac2)}
.b.rec{background:#d93025;border-color:#d93025;color:#fff}
.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
/* строки задач */
.trow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid transparent;border-radius:12px;padding:11px 12px;margin-bottom:6px;box-shadow:var(--sh);cursor:pointer}
.trow:hover{border-color:var(--bd)}
.trow.on{border-color:var(--ac);background:var(--ac2)}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--mu);flex:none;position:relative;padding:0}
.ck:hover{border-color:var(--ac)}
.ck.on{background:var(--ac);border-color:var(--ac)}
.ck.on::after{content:"✓";color:#fff;font-size:13px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ck.sm{width:18px;height:18px}.ck.sm.on::after{font-size:11px}
.tbody{flex:1;min-width:0}
.ttl{overflow-wrap:anywhere}
.trow.done .ttl{text-decoration:line-through;color:var(--mu)}
.tmeta{font-size:12.5px;color:var(--mu);margin-top:2px;display:flex;gap:12px;flex-wrap:wrap}
.tmeta .over{color:var(--red)}
.star{font-size:21px;color:var(--mu);padding:2px 6px;line-height:1}
.star.on{color:var(--star)}
.star:hover{color:var(--star)}
.sech{margin:20px 4px 8px;font-weight:600;font-size:14px;color:var(--mu)}
.sech.red,.sech.red button{color:var(--red)}
.sech button{font-weight:600}
.sech.clk{cursor:pointer}
.ib{color:var(--mu);font-size:16px;padding:4px 8px;border-radius:8px}
.ib:hover{background:var(--ac2);color:var(--tx)}
.dc{font-size:12.5px;border:1px solid var(--bd);border-radius:99px;padding:3px 10px;color:var(--mu);white-space:nowrap}
.dc.empty{border-color:transparent;opacity:.6}
.dc.over{color:var(--red);border-color:var(--red)}
.dc:hover{background:var(--ac2)}
/* панель задачи */
#detail{width:360px;flex:none;background:var(--panel);border-left:1px solid var(--bd);overflow:auto;padding:14px}
.dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dcard{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.dh{display:flex;align-items:center;gap:10px}
.dtitle{flex:1;min-width:0;border:0;background:transparent;font-size:18px;font-weight:600;padding:6px 2px}
.dtitle:focus{outline:0;border-bottom:2px solid var(--ac)}
.srow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)}
.srow:last-of-type{border-bottom:0}
.srow.done .stx{text-decoration:line-through;color:var(--mu)}
.stx{flex:1;min-width:0;cursor:text;overflow-wrap:anywhere}
.ei{border:1px solid var(--ac);border-radius:8px;padding:3px 8px;background:var(--panel);flex:1;min-width:0}
.dbtn{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--bd);margin-bottom:10px}
.dbtn:hover{background:var(--ac2)}
.dbtn.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.drow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;border:1px solid var(--bd);border-radius:99px;padding:3px 10px;background:var(--panel)}
.chip:hover{background:var(--ac2)}
.dnote{width:100%;min-height:90px;resize:vertical;border:0;background:transparent;padding:4px 2px}
.dnote:focus{outline:0}
/* календарь и дневник */
.dgrid{display:grid;grid-template-columns:minmax(290px,350px) 1fr;gap:16px;align-items:start}
@container (max-width:780px){.dgrid{grid-template-columns:1fr}}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav b{font-size:17px;display:inline-block}
.nav b::first-letter{text-transform:uppercase}
.nav button{width:36px;height:36px;border-radius:50%;font-size:20px;background:var(--ac2)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wd{font-size:12px;color:var(--mu);padding:4px 0}
.d{aspect-ratio:1;border-radius:12px;position:relative;display:flex;align-items:center;justify-content:center;padding:0;min-width:0}
.d:hover{background:var(--ac2)}
.d i{position:absolute;bottom:5px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:var(--mu)}
.d.ok{background:#c4ebcf;color:#14532d}
.d.wait{background:#fdeaa9;color:#6b4a00}
.d.late{background:#f6c6c1;color:#8a1c14}
.d.ok:hover{background:#b0e2bf}.d.wait:hover{background:#fbdf85}.d.late:hover{background:#f1b0aa}
.d.today{font-weight:700;box-shadow:inset 0 0 0 2px var(--ac)}
.d.sel{box-shadow:inset 0 0 0 2.5px var(--tx);font-weight:700}
.d.sel:not(.ok):not(.wait):not(.late){background:var(--bd)}
.legend{display:flex;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.legend .lg::before{background:#c4ebcf}.legend .ly::before{background:#fdeaa9}.legend .lr::before{background:#f6c6c1}
.legend .ld::before{width:5px;height:5px;border-radius:50%;background:var(--mu);margin:0 7px 0 3px;vertical-align:1px}
.pwwrap{position:relative;max-width:320px;margin-bottom:10px}
.pwwrap input{margin:0!important;max-width:none!important;width:100%;padding-right:42px!important}
.lk .pwwrap{max-width:none;margin:0 auto 10px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:4px 8px;font-size:16px;opacity:.7}
.eye:hover{opacity:1}
.edhead{display:flex;justify-content:space-between;align-items:center}
#t{width:100%;min-height:300px;resize:vertical;border:1px solid var(--bd);border-radius:12px;padding:14px;background:var(--bg);line-height:1.55;font-size:16px}
#t:focus{outline:2px solid var(--ac)}
.edcard.fs{position:fixed;inset:0;z-index:35;margin:0;border-radius:0;overflow:auto;padding:24px clamp(16px,8vw,120px);display:flex;flex-direction:column}
.edcard.fs #t{flex:1;min-height:55vh;font-size:19px}
.it{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--bd)}
.it:first-of-type{border-top:0}
.it small{color:var(--ac);font-weight:600}
.it span{display:block;color:var(--mu);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.att{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-top:8px}
.att .body{flex:1;min-width:0}
.att img{max-width:100%;max-height:260px;border-radius:8px;cursor:zoom-in;display:block}
.att audio{width:100%;margin-top:4px}
.att a{color:var(--ac)}
.att .x{color:var(--mu);font-size:18px}
.nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;cursor:zoom-out;z-index:55}
#lb img{max-width:95%;max-height:95%}
/* пароль, окна */
#lock,#md{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#lock{background:var(--bg);z-index:60}
#md{background:rgba(0,0,0,.45);z-index:50}
.lk,.mc{background:var(--panel);border:1px solid var(--bd);border-radius:16px;padding:24px;width:min(340px,90vw);text-align:center;box-shadow:var(--sh)}
.lk .big{font-size:42px}
.lk h2{margin:4px 0 14px;color:var(--ac)}
.lk input,.fld{width:100%;margin-bottom:10px;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:var(--bg)}
.mc #mtxt{white-space:pre-line;margin-bottom:14px}
.mc .bar{justify-content:center;margin:0}
.fld{display:block;max-width:320px}
.err2{color:var(--red);font-size:13px;min-height:18px}
select{border:1px solid var(--bd);border-radius:10px;padding:6px 8px;background:var(--bg)}
.row2{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.locked #app{visibility:hidden}
#scrim{display:none}
@media (max-width:860px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh);width:min(300px,86vw)}
  body.side-open #side{transform:none}
  body.side-open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
  #detail{position:fixed;inset:0;width:auto;z-index:25;border-left:0}
  .mbar{display:flex}
  .ptitle{font-size:26px}
}
/* v3 */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45;display:flex;align-items:center;justify-content:center;padding:16px}
.dbox{background:var(--panel);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);width:min(560px,100%);max-height:88vh;overflow:auto;padding:18px}
.dbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.dlab{font-size:13px;color:var(--mu);margin:14px 0 6px;font-weight:600}
.emojis{display:flex;flex-wrap:wrap;gap:4px}
.emo{width:38px;height:38px;border-radius:10px;font-size:20px;border:1px solid transparent}
.emo:hover{background:var(--ac2)}.emo.on{border-color:var(--ac);background:var(--ac2)}
.cdots{display:flex;gap:10px;flex-wrap:wrap}
.cdot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;color:var(--mu);font-size:13px}
.cdot.none{border-color:var(--bd)}
.cdot.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--tx)}
.pickbox{max-height:220px;overflow:auto;border:1px solid var(--bd);border-radius:12px;padding:6px 10px;margin-top:8px;background:var(--bg)}
.pick{display:block;padding:5px 0;cursor:pointer}
.b.act{background:var(--ac);color:#fff}.b.act:hover{background:var(--ac);opacity:.9}
.b.danger,.bb.danger{border-color:var(--red);color:var(--red)}
.lbl2{font-size:13px;color:var(--mu);margin-bottom:6px;font-weight:600}
.slab{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:12px 12px 4px;border-radius:8px}
.sitem.ind{padding-left:30px}
.sitem.dragover,.sproj.dragover,.slab.dragover{background:var(--ac2);outline:2px dashed var(--ac)}
.sproj{display:flex;align-items:center;border-radius:10px}
.sproj .sar{width:26px;color:var(--mu);padding:6px 0 6px 8px}
.sproj .pn{padding-left:4px}
.sproj.on{background:var(--ac2)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{text-align:left;background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.pcard:hover{border-color:var(--ac)}
.pcard .pc1{font-weight:600;margin-bottom:4px}
.pcard .pb{margin:8px 0 0}
.trow.colored{background:color-mix(in srgb,var(--tc) 13%,var(--panel));box-shadow:inset 5px 0 0 var(--tc),var(--sh)}
.trow.picked{border-color:var(--ac);background:var(--ac2)}
.scb{width:22px;height:22px;border-radius:6px;border:2px solid var(--mu);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.scb.on{background:var(--ac);border-color:var(--ac)}
#bulk{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;background:var(--panel);border:1px solid var(--bd);box-shadow:0 8px 30px rgba(0,0,0,.25);border-radius:16px;padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:94vw;justify-content:center}
#bulk .bn{font-weight:600;margin-right:6px}
.bb{padding:7px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
.bb:hover:not(:disabled){background:var(--ac2)}.bb:disabled{opacity:.4;cursor:default}
.sugrow{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px 8px 8px 12px;margin-bottom:6px}
.plusb{color:var(--ac);font-size:20px}
.frow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)}
.frow:last-of-type{border-bottom:0}
.fth{width:40px;height:40px;object-fit:cover;border-radius:8px;cursor:zoom-in}
.fic{font-size:24px;width:40px;text-align:center}
.frow a{text-decoration:none;color:var(--ac);padding:2px 6px}
#toasts{position:fixed;top:14px;right:14px;z-index:70;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--ac);border-left:5px solid var(--ac);border-radius:12px;box-shadow:var(--sh);padding:12px 16px;max-width:340px;cursor:pointer}
.nm.ren{cursor:text}
#detail{overflow-x:hidden}
.dcard select,.dcard input[type=date],.dcard input[type=datetime-local]{max-width:100%;min-width:0}
.dcard select{width:100%}
.drow>select,.drow>input[type=datetime-local],.drow>input[type=date]{flex:1 1 150px}
.drow>input[type=number]{flex:0 0 64px}
.drow>select.sm{flex:1 1 90px;width:auto}
.dest{display:grid;gap:4px}
.dest .dl2{font-size:12px;color:var(--mu);margin-top:4px}
.wkl{font-size:12px;color:var(--mu);margin:12px 0 6px}
.wkrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayb{aspect-ratio:1;width:100%;max-width:42px;justify-self:center;border-radius:50%;border:1.5px solid var(--bd);background:var(--panel);font-size:12.5px;font-weight:600;padding:0}
.dayb:hover{border-color:var(--ac)}
.dayb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pickh{font-weight:600;font-size:13px;color:var(--mu);margin:10px 0 2px}
.trow.virt{box-shadow:none;border:1px dashed var(--bd);background:transparent;opacity:.9}
.ck.dis{border-style:dashed;cursor:default}
.ck.dis:hover{border-color:var(--mu)}
.back{display:inline-flex;align-items:center;margin:-6px 0 12px -8px;padding:6px 12px;border-radius:10px;color:var(--ac);font-weight:600}
.back:hover{background:var(--ac2)}
#snew{border-bottom:1px solid var(--bd);margin-bottom:6px;padding-bottom:6px}
.sfoot .sitem{padding:8px 12px}
.sbrand{position:relative}
.sdot{margin-left:auto;font-size:18px;padding:2px 8px;border-radius:8px}
.sdot.ok{color:var(--ac)}.sdot.busy{color:#d9a800}.sdot.err{color:var(--red)}
.sdot:hover{background:var(--ac2)}
@supports (height:100dvh){#app{height:100dvh}}
@media (max-width:860px){
  #main{padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
  .phead{flex-wrap:wrap;gap:8px 10px}
  .phead .hgrow{flex:1 1 55%;min-width:0}
  .phead .b{padding:7px 10px;font-size:14px}
  .addbar{flex-wrap:wrap}
  .addbar input[type=date]{flex:1 1 140px}
  .tmeta{gap:8px}
  .dbox{max-height:92vh}
  #bulk{bottom:calc(10px + env(safe-area-inset-bottom));padding:6px 8px}
  .bb{padding:7px 9px;font-size:14px}
  #toasts{left:10px;right:10px;top:calc(10px + env(safe-area-inset-top))}.toast{max-width:none}
  .sfoot{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}
@media (pointer:coarse){
  .ib{padding:8px 10px;font-size:18px;opacity:1}
  .dc{padding:6px 11px;font-size:13px}
  .b{padding:10px 14px}
  input,textarea,select{font-size:16px}
  .ck{width:26px;height:26px}.ck.sm{width:22px;height:22px}
  .scb{width:26px;height:26px}
  .sitem{padding:11px 12px}
  .dayb{max-width:46px}
}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
</style>
</head>
<body>
<div id="app">
<aside id="side">
  <div class="sbrand"><span class="logo">📗</span><b>Мой дневник</b><button class="sdot" id="sdot" hidden title="Синхронизация">☁</button></div>
  <div class="search"><span class="si">🔍</span><input id="q" type="text" placeholder="Поиск" autocomplete="off"><button id="qx" hidden aria-label="Очистить">✕</button></div>
  <div class="sscroll">
    <div id="snav"></div>
    <div class="sdiv"></div>
    <div id="slists"></div>
  </div>
  <div class="sfoot">
    <div id="snew"></div>
    <button class="sitem" id="n-diary"><span class="ic">📅</span><span class="sn">Календарь и дневник</span></button>
    <button class="sitem" id="n-settings"><span class="ic">⚙️</span><span class="sn">Настройки</span></button>
    <button class="sitem" id="lockbtn" hidden><span class="ic">🔒</span><span class="sn">Заблокировать</span></button>
  </div>
</aside>
<div id="scrim"></div>
<main id="main">
  <div class="mbar"><button id="menu" aria-label="Меню">☰</button><span id="mbt"></span></div>
  <div id="err" class="errb" hidden></div>
  <section id="v-tasks"></section>
  <section id="v-diary" hidden>
    <div class="phead"><span class="pico">📅</span><div><h1 class="ptitle">Календарь и дневник</h1><div class="psub" style="text-transform:none">Задачи и записи по дням</div></div></div>
    <div class="dgrid">
      <div class="card">
        <div class="nav"><button id="prev" aria-label="Назад">‹</button><b id="mt"></b><button id="next" aria-label="Вперёд">›</button></div>
        <div class="grid" id="g"></div>
        <div class="legend"><span class="lr">просрочено</span><span class="ly">задачи впереди</span><span class="lg">всё выполнено</span><span class="ld">есть запись</span></div>
      </div>
      <div>
        <div class="card"><div class="lbl" id="dl"></div><div id="daytasks"></div></div>
        <div class="card edcard" id="edcard">
          <div class="edhead"><div class="lbl">📖 Запись дня</div><button class="ib" id="fsb" title="На весь экран">⤢</button></div>
          <textarea id="t" placeholder="Что произошло сегодня?"></textarea>
          <div class="bar">
            <button class="b" id="bp">🖼 Фото</button>
            <button class="b" id="bf">📎 Файл</button>
            <button class="b" id="br">🎙 Запись</button>
          </div>
          <div id="att"></div>
        </div>
      </div>
    </div>
    <div class="card"><div class="lbl">Все записи</div><div id="list"></div></div>
  </section>
  <section id="settings" hidden></section>
</main>
<aside id="detail" hidden></aside>
</div>
<div id="lock" hidden><div class="lk"><div class="big">🔒</div><h2>Мой дневник</h2>
<input id="lp" type="password" placeholder="Пароль" autocomplete="off"><button class="b" id="lgo">Войти</button><div class="err2" id="lerr"></div></div></div>
<div id="md" hidden><div class="mc"><div id="mtxt"></div><div class="bar"><button class="b" id="myes">OK</button><button class="b" id="mno">Отмена</button></div></div></div>
<div id="dlg" hidden><div class="dbox"><div class="dbh"><b id="dlgt"></b><button class="ib" id="dlgx">✕</button></div><div id="dlgb"></div></div></div>
<div id="bulk" hidden></div>
<div id="toasts"></div>

<input type="file" id="ff" multiple hidden>
<div id="lb" hidden></div>
<script>
// ---- iPhone / браузер (веб-приложение): копии и файлы через «Поделиться», оффлайн-режим ----
(function () {
  if (window.diaryAPI || window.Capacitor) return;
  var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  function download(name, blob) {
    var u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
  }
  async function shareFile(name, blob, title) {
    var f = new File([blob], name, { type: blob.type || 'application/octet-stream' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f], title: title || name }); return true; }
      catch (e) {
        if (e && e.name === 'AbortError') return 'cancel';
        if (!(await ask('Файл готов. Нажмите «Сохранить», чтобы выбрать, куда его отправить.', 'Сохранить'))) return 'cancel';
        try { await navigator.share({ files: [f], title: title || name }); return true; } catch (e2) { if (e2 && e2.name === 'AbortError') return 'cancel'; }
      }
    }
    download(name, blob); return true;
  }
  window.diaryShare = function (a) { return shareFile(a.name, a.blob).catch(function () {}); };
  window.diaryAPI = {
    saveBackup: async function (name, bytes) {
      var r = await shareFile(name, new Blob([bytes], { type: 'application/json' }), 'Копия дневника');
      if (r === 'cancel') return { ok: false };
      return { ok: true, path: 'выбранное место (Файлы, iCloud Drive, Telegram…)' };
    },
    openBackup: function () {
      return new Promise(function (res) {
        var i = document.createElement('input'); i.type = 'file'; i.accept = '*/*';
        i.onchange = async function () {
          var f = i.files && i.files[0]; if (!f) return res({ ok: false });
          res({ ok: true, path: f.name, bytes: new Uint8Array(await f.arrayBuffer()) });
        };
        i.oncancel = function () { res({ ok: false }); };
        i.click();
      });
    }
  };
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function () {});
  setTimeout(function () {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios && !standalone && !lsGet('web-hint', false)) {
      lsSet('web-hint', true);
      toast('Чтобы установить приложение: нажмите «Поделиться» (квадрат со стрелкой) → «На экран «Домой»». Дальше открывайте дневник с этого значка.');
    }
  }, 1500);
})();

var db, entries = {}, sel, view, urls = [], pend = null, timer = null;
var rec = null, chunks = [], recDay, tStart, tick;
var $ = function (i) { return document.getElementById(i); };
function key(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parse(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function fmt(d, o) { return d.toLocaleDateString('ru-RU', o); }
function mmss(t) { t = Math.floor(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// ---- хранилище (IndexedDB, лежит в профиле приложения) ----
function idb() {
  return new Promise(function (res, rej) {
    var r = indexedDB.open('diary-db', 2);
    r.onupgradeneeded = function () { var d = r.result; if (!d.objectStoreNames.contains('entries')) d.createObjectStore('entries', { keyPath: 'day' }); if (!d.objectStoreNames.contains('goals')) d.createObjectStore('goals', { keyPath: 'id' }); };
    r.onsuccess = function () { res(r.result); };
    r.onblocked = function () { showErr('База занята другим окном дневника. Закройте все окна программы (и в диспетчере задач), затем откройте её заново.'); };
    r.onerror = function () { rej(r.error); };
  });
}
function tx(store, mode, fn) {
  return new Promise(function (res, rej) {
    var t = db.transaction(store, mode, { durability: 'relaxed' }), out = fn(t.objectStore(store));
    t.oncomplete = function () { res(out && out.result); };
    t.onerror = function () { rej(t.error); };
  });
}
function dbPut(e) { e.rev = nextRev(e.rev); markDirty('entry', e.day); return tx('entries', 'readwrite', function (s) { return s.put(e); }); }
function dbDel(k) { markTomb('entry', k); return tx('entries', 'readwrite', function (s) { return s.delete(k); }); }
function dbAll() { return tx('entries', 'readonly', function (s) { return s.getAll(); }); }

function gPut(g) { g.rev = nextRev(g.rev); markDirty(g.kind === 'project' ? 'project' : 'goal', g.id); return tx('goals', 'readwrite', function (s) { return s.put(g); }); }
function gDel(id, kind) { markTomb(kind || 'goal', id); return tx('goals', 'readwrite', function (s) { return s.delete(id); }); }
function gAll() { return tx('goals', 'readonly', function (s) { return s.getAll(); }); }

function showErr(m) { var b = $('err'); b.textContent = m; b.hidden = false; }
function storageErr(e) { showErr('Не удаётся сохранить данные (' + ((e && e.message) || e || 'неизвестная ошибка') + '). Закройте все окна дневника и откройте программу заново.'); }
function mutate(day, fn) {
  var e = entries[day] || { day: day, text: '', attachments: [] }, p;
  fn(e);
  if (!e.text.trim() && !e.attachments.length) { delete entries[day]; p = dbDel(day); }
  else { entries[day] = e; p = dbPut(e); }
  p.catch(storageErr);
  return Promise.resolve();
}

// ---- текст ----
function flush() {
  clearTimeout(timer); timer = null;
  if (!pend) return Promise.resolve();
  var p = pend; pend = null;
  return mutate(p.day, function (e) { e.text = p.value; }).then(function () { cal(); list(); });
}
$('t').oninput = function () {
  pend = { day: sel, value: $('t').value };
  clearTimeout(timer); timer = setTimeout(flush, 400);
};
async function pick(k) { await flush(); sel = k; show(); }

// ---- вложения ----
async function addFiles(files) {
  await flush();
  var day = sel;
  for (var f of files) {
    var ty = f.type || '';
    var kind = ty.startsWith('image/') ? 'photo' : ty.startsWith('audio/') ? 'audio' : 'file';
    await mutate(day, function (e) {
      e.attachments.push({ id: crypto.randomUUID(), kind: kind, name: f.name, type: ty, duration: 0, blob: f, createdAt: Date.now() });
    });
  }
  show(); list();
}
$('bp').onclick = function () { $('fp').click(); };
$('bf').onclick = function () { $('ff').click(); };
$('fp').onchange = $('ff').onchange = function () { addFiles(Array.from(this.files)); this.value = ''; };

function recLabel() {
  var b = $('br');
  if (rec) { b.className = 'b rec'; b.textContent = '⏹ Стоп ' + mmss((Date.now() - tStart) / 1000); }
  else { b.className = 'b'; b.textContent = '🎙 Запись'; }
}
$('br').onclick = async function () {
  if (rec) { rec.stop(); return; }
  try {
    await flush();
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recDay = sel; chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = function (e) { chunks.push(e.data); };
    rec.onstop = async function () {
      clearInterval(tick);
      stream.getTracks().forEach(function (t) { t.stop(); });
      var dur = (Date.now() - tStart) / 1000;
      var blob = new Blob(chunks, { type: rec.mimeType });
      rec = null; recLabel();
      var name = 'Запись ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      await mutate(recDay, function (e) {
        e.attachments.push({ id: crypto.randomUUID(), kind: 'audio', name: name, type: blob.type, duration: dur, blob: blob, createdAt: Date.now() });
      });
      show(); list();
    };
    rec.start(); tStart = Date.now();
    tick = setInterval(recLabel, 250); recLabel();
  } catch (err) {
    say('Нет доступа к микрофону. Проверьте: Параметры Windows → Конфиденциальность → Микрофон → разрешить классическим приложениям.');
  }
};

function nameEl(a, pre, post) {
  var d = el('div', 'nm ren', pre + a.name + post); d.title = 'Нажмите, чтобы переименовать';
  d.onclick = function () {
    editInline(d, a.name, function (v) {
      mutate(sel, function (e) { e.attachments.forEach(function (z) { if (z.id === a.id) z.name = v; }); }); show(); list();
    }, function () { atts(); });
  };
  return d;
}
function atts() {
  urls.forEach(URL.revokeObjectURL); urls = [];
  var box = $('att'); box.innerHTML = '';
  var e = entries[sel]; if (!e) return;
  e.attachments.slice().sort(function (a, b) { return a.createdAt - b.createdAt; }).forEach(function (a) {
    var u = URL.createObjectURL(a.blob); urls.push(u);
    var row = el('div', 'att'), body = el('div', 'body');
    if (a.kind === 'photo') {
      var im = el('img'); im.src = u; im.alt = a.name;
      im.onclick = function () { var lb = $('lb'); lb.innerHTML = ''; var big = el('img'); big.src = u; lb.appendChild(big); lb.hidden = false; };
      body.appendChild(im);
    } else if (a.kind === 'audio') {
      body.appendChild(nameEl(a, '', a.duration ? ' · ' + mmss(a.duration) : ''));
      var au = el('audio'); au.controls = true; au.src = u; body.appendChild(au);
    } else {
      body.appendChild(nameEl(a, '📄 ', ''));
      var dl = el('a', '', 'Сохранить'); dl.href = u; dl.download = a.name;
      if (window.diaryShare) dl.onclick = function (ev) { ev.preventDefault(); window.diaryShare(a); };
      body.appendChild(dl);
    }
    var x = el('button', 'x', '🗑'); x.title = 'Удалить';
    x.onclick = async function () {
      if (!(await ask('Удалить вложение?', 'Удалить'))) return;
      await mutate(sel, function (en) { en.attachments = en.attachments.filter(function (z) { return z.id !== a.id; }); });
      show(); list();
    };
    row.appendChild(body); row.appendChild(x); box.appendChild(row);
  });
}
$('lb').onclick = function () { $('lb').hidden = true; };

// ---- календарь и дневник ----
function futureOcc(n, toK, fromK) {
  var out = [], d = n.due, i = 0;
  if (!n.repeat || n.done || !d) return out;
  while (i++ < 800) { d = nextDue(d, n.repeat); if (d > toK) break; if (d >= fromK) out.push(d); }
  return out;
}
function dayStatus(from, to) {
  var m = {};
  collect(function (n) { return !!n.due; }).forEach(function (x) {
    var st = m[x.n.due] || (m[x.n.due] = { open: 0, done: 0 });
    if (x.n.done) st.done++; else st.open++;
  });
  var f2 = from > todayK() ? from : todayK();
  collect(function (n) { return n.repeat && !n.done && n.due; }).forEach(function (x) {
    futureOcc(x.n, to, f2).forEach(function (k) { var st = m[k] || (m[k] = { open: 0, done: 0 }); st.open++; });
  });
  return m;
}
function cal() {
  $('mt').textContent = fmt(view, { month: 'long', year: 'numeric' });
  var h = ''; ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(function (w) { h += '<div class="wd">' + w + '</div>'; });
  var off = (view.getDay() + 6) % 7, n = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate(), i, tk = key(new Date()), dm = dayStatus(key(new Date(view.getFullYear(), view.getMonth(), 1)), key(new Date(view.getFullYear(), view.getMonth() + 1, 0)));
  for (i = 0; i < off; i++) h += '<div></div>';
  for (i = 1; i <= n; i++) {
    var k = key(new Date(view.getFullYear(), view.getMonth(), i)), st = dm[k];
    var c = !st ? '' : st.open ? (k < tk ? ' late' : ' wait') : ' ok';
    h += '<button class="d' + c + (k === tk ? ' today' : '') + (k === sel ? ' sel' : '') + '" data-k="' + k + '"><span>' + i + '</span>' + (entries[k] ? '<i></i>' : '') + '</button>';
  }
  $('g').innerHTML = h;
}
function list() {
  var box = $('list'); box.innerHTML = '';
  var ks = Object.keys(entries).sort().reverse();
  if (!ks.length) { box.appendChild(el('div', 'hint', 'Пока пусто. Напишите первую запись.')); return; }
  ks.forEach(function (k) {
    var e = entries[k], b = el('button', 'it');
    var n = e.attachments.length;
    b.appendChild(el('small', '', fmt(parse(k), { day: 'numeric', month: 'long', year: 'numeric' }) + (n ? '  📎 ' + n : '')));
    b.appendChild(el('span', '', e.text.trim() ? e.text.replace(/\s+/g, ' ') : 'Только вложения'));
    b.onclick = async function () { await flush(); sel = k; var d = parse(k); view = new Date(d.getFullYear(), d.getMonth(), 1); show(); $('main').scrollTop = 0; };
    box.appendChild(b);
  });
}
function show() {
  $('dl').textContent = 'Задачи на ' + fmt(parse(sel), { weekday: 'long', day: 'numeric', month: 'long' });
  $('t').value = (entries[sel] && entries[sel].text) || '';
  cal(); renderDayTasks(); atts();
}
$('g').onclick = function (e) { var b = e.target.closest('.d'); if (b) pick(b.dataset.k); };
$('prev').onclick = function () { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); cal(); };
$('next').onclick = function () { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); cal(); };
$('fsb').onclick = function () {
  var c = $('edcard'), on = c.classList.toggle('fs');
  this.textContent = on ? '✕' : '⤢'; this.title = on ? 'Свернуть (Esc)' : 'На весь экран';
  if (on) $('t').focus();
};
window.addEventListener('beforeunload', flush);

function renderDayTasks() {
  var box = $('daytasks'); box.innerHTML = '';
  var items = collect(function (n) { return n.due === sel; });
  var open = items.filter(function (x) { return !x.n.done; }), done = items.filter(function (x) { return x.n.done; });
  var occ = collect(function (n) { return !!n.repeat && !n.done && !!n.due && n.due !== sel && futureOcc(n, sel, sel).length > 0; });
  box.appendChild(addBar('Добавить задачу на этот день', 'day', function (t) { addTask(inbox(), t, { due: sel }); }, true));
  if (!items.length && !occ.length) box.appendChild(el('div', 'hint', 'На этот день задач нет.'));
  open.concat(done).forEach(function (x) { box.appendChild(taskRow(x, true)); });
  occ.forEach(function (x) {
    var r = el('div', 'trow virt'), ck = el('span', 'ck dis'), body = el('div', 'tbody');
    ck.title = 'Будущее повторение: отметить можно, когда наступит срок';
    body.appendChild(el('div', 'ttl', x.n.text)); body.appendChild(el('div', 'tmeta', '🔁 ' + repeatText(x.n.repeat) + ' · ' + x.g.title));
    r.appendChild(ck); r.appendChild(body); r.onclick = function () { cur = { gid: x.g.id, id: x.n.id }; renderAll(); };
    box.appendChild(r);
  });
}

// ---- задачи, списки, проекты (в стиле Microsoft To Do) ----
var goals = [], projects = [], openAdd = null, refocus = null, nav = { v: 'myday', id: null }, cur = null, query = '', doneOpen = {};
var unlocked = {}, selMode = false, selected = {}, fileUrls = [], drag = null;
var COLORS = { red: '#e5484d', orange: '#f08a24', yellow: '#d9a800', green: '#30a46c', teal: '#12a594', blue: '#3e63dd', purple: '#8e4ec6', pink: '#d6409f', gray: '#8b8d98' };
var ICONS = ['🎯', '🏠', '📚', '💼', '🏃', '💪', '🧘', '🛒', '✈️', '🎓', '💡', '🧹', '🍎', '🎵', '🎮', '🎨', '💰', '❤️', '⭐', '🔥', '🌱', '🐶', '🚗', '🛠️', '📞', '🏥', '🍳', '🎁', '📝', '🧠', '⚽', '☕', '🌍', '📷', '💻', '🏖️'];
function uid() { return crypto.randomUUID(); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function newNode(t, d) { return { id: uid(), text: t, done: false, due: d || '', children: [], important: false, myDay: '', note: '', color: '', repeat: null, remind: '', reminded: false, files: [] }; }
function leaves(nodes, out) { nodes.forEach(function (n) { if (n.children.length) leaves(n.children, out); else out.push(n); }); return out; }

  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ':' + canon(v[k]); }).join(',') + '}';
  return JSON.stringify(v);
}
function plain(doc) { return JSON.parse(JSON.stringify(doc, function (k, v) { return (k === 'blob' || k === 'rev' || k.charAt(0) === '_') ? undefined : v; })); }
function nextRev(old) { return Math.max(Date.now(), (old || 0) + 1); }

// какие записи изменены и не отправлены
function markDirty(kind, id) {
  if (!syncOn()) return;
  var d = lsGet('sync-dirty', {}), t = lsGet('sync-tomb', {}), k = kind + ':' + id;
  d[k] = 1; lsSet('sync-dirty', d); if (t[k]) { delete t[k]; lsSet('sync-tomb', t); }
  scheduleSync();
}
function markTomb(kind, id) {
  if (!syncOn()) return;
  var d = lsGet('sync-dirty', {}), t = lsGet('sync-tomb', {}), k = kind + ':' + id;
  delete d[k]; lsSet('sync-dirty', d); t[k] = Date.now(); lsSet('sync-tomb', t);
  scheduleSync();
}
function scheduleSync(ms) { if (!syncOn()) return; clearTimeout(SY.timer); SY.timer = setTimeout(function () { syncNow(false); }, ms == null ? 4000 : ms); }
function localDoc(kind, id) { return kind === 'entry' ? entries[id] : kind === 'goal' ? goalById(id) : projById(id); }
function syncAllKeys() {
  var o = {};
  Object.keys(entries).forEach(function (k) { o['entry:' + k] = 1; });
  goals.forEach(function (g) { o['goal:' + g.id] = 1; }); projects.forEach(function (p) { o['project:' + p.id] = 1; });
  return o;
}
function isTrivial(kind, d) { return kind === 'goal' && d.id === 'inbox' && !(d.tasks || []).length && !d.lock && !d.icon; }
function syncAfterRestore(oldKeys) {
  if (!syncOn()) return;
  var now = Date.now(), nk = {};
  Object.keys(entries).forEach(function (k) { entries[k].rev = now; nk['entry:' + k] = 1; markDirty('entry', k); });
  goals.forEach(function (g) { g.rev = now; nk['goal:' + g.id] = 1; markDirty('goal', g.id); });
  projects.forEach(function (p) { p.rev = now; nk['project:' + p.id] = 1; markDirty('project', p.id); });
  Object.keys(oldKeys).forEach(function (k) { if (!nk[k]) { var i = k.indexOf(':'); markTomb(k.slice(0, i), k.slice(i + 1)); } });
}

// шифрование на устройстве
async function deriveSyncKey(c) {
  var base = await crypto.subtle.importKey('raw', TE.encode(c.pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: TE.encode('diary-sync:' + c.uid), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encBytes(bytes) {

  out.set(iv); out.set(ct, 12); return out;
}
async function decBytes(bytes) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, SY.key, bytes.slice(12))); }
async function encDoc(obj) { return { v: 1, c: bytesToB64(await encBytes(TE.encode(JSON.stringify(obj)))) }; }
async function decDoc(w) { return JSON.parse(TD.decode(await decBytes(b64ToBytes(w.c)))); }

// обращения к серверу
async function sApi(method, path, body, headers) {
  var c = SY.cfg, h = Object.assign({ apikey: c.key, Authorization: 'Bearer ' + SY.tok }, headers || {});
  if (body !== undefined && !(body instanceof Uint8Array)) { h['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
  var r = await fetch(c.url.replace(/\/+$/, '') + path, { method: method, headers: h, body: body });
  if (!r.ok) {
    var t = ''; try { t = await r.text(); } catch (e) {}
    var msg = t; try { var j = JSON.parse(t); msg = j.msg || j.message || j.error_description || j.error || t; } catch (e) {}
    var er = new Error(msg || ('HTTP ' + r.status)); er.status = r.status; throw er;
  }
  return r;
}
async function sAuth(mode, url, key, email, password, refresh) {
  var path = mode === 'signup' ? '/auth/v1/signup' : (refresh ? '/auth/v1/token?grant_type=refresh_token' : '/auth/v1/token?grant_type=password');
  var r = await fetch(url.replace(/\/+$/, '') + path, { method: 'POST', headers: { apikey: key, 'Content-Type': 'application/json' }, body: JSON.stringify(refresh ? { refresh_token: refresh } : { email: email, password: password }) });
  var j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || j.error || ('HTTP ' + r.status));
  return j;
}
async function ensureToken() {
  var c = SY.cfg;
  if (SY.tok && Date.now() < SY.exp) return;
  var j = await sAuth('login', c.url, c.key, '', '', c.refresh);
  c.refresh = j.refresh_token || c.refresh; lsSet('sync-cfg', c);
  SY.tok = j.access_token; SY.exp = Date.now() + (j.expires_in || 3600) * 1000 - 60000;
}
async function upsertRows(rows) {
  var uid = SY.cfg.uid;
  for (var i = 0; i < rows.length; i += 40) {
    var part = rows.slice(i, i + 40).map(function (r) { return Object.assign({ user_id: uid }, r); });
    await sApi('POST', '/rest/v1/docs?on_conflict=user_id,kind,id', part, { Prefer: 'resolution=merge-duplicates,return=minimal' });
  }
}
async function verifyKey() {
  var rows = await (await sApi('GET', '/rest/v1/docs?select=data&kind=eq.meta&id=eq.check')).json();
  if (rows.length) {
    var ok = false; try { ok = (await decDoc(rows[0].data)) === 'diary-ok'; } catch (e) {}
    if (!ok) throw new Error('Неверный пароль шифрования. Он должен совпадать с паролем, который вы задали на первом устройстве.');
  } else await upsertRows([{ kind: 'meta', id: 'check', data: await encDoc('diary-ok'), deleted: false, rev: Date.now() }]);
}

// вложения (файлы, фото, аудио) хранятся в зашифрованном виде в Storage
function blobItems(kind, doc) {
  var out = [];
  if (kind === 'entry') (doc.attachments || []).forEach(function (a) { out.push(a); });
  else if (kind === 'goal') (function rec(l) { l.forEach(function (n) { (n.files || []).forEach(function (f) { out.push(f); }); rec(n.children || []); }); })(doc.tasks || []);
  return out;
}
async function uploadBlob(it) {
  var bytes = new Uint8Array(await it.blob.arrayBuffer());
  await sApi('POST', '/storage/v1/object/files/' + SY.cfg.uid + '/' + it.id, await encBytes(bytes), { 'Content-Type': 'application/octet-stream', 'x-upsert': 'true' });
}
async function downloadBlob(it) {
  var r = await sApi('GET', '/storage/v1/object/authenticated/files/' + SY.cfg.uid + '/' + it.id);
  return new Blob([await decBytes(new Uint8Array(await r.arrayBuffer()))], { type: it.type || 'application/octet-stream' });
}
async function resolveBlobs(kind, rdoc, ldoc) {
  var have = {}, up = lsGet('sync-blobs', {});
  if (ldoc) blobItems(kind, ldoc).forEach(function (x) { if (x.blob) have[x.id] = x.blob; });
  for (var it of blobItems(kind, rdoc)) {
    if (have[it.id]) it.blob = have[it.id];
    else { it.blob = await downloadBlob(it); }
    up[it.id] = 1;
  }
  lsSet('sync-blobs', up);
}

// применить документ с сервера на этом устройстве (без пометки «изменено»)
function rawPut(store, doc) { return tx(store, 'readwrite', function (s) { return s.put(doc); }); }
function rawDel(store, id) { return tx(store, 'readwrite', function (s) { return s.delete(id); }); }
async function applyDoc(kind, doc) {
  if (kind === 'entry') { entries[doc.day] = doc; await rawPut('entries', doc); }
  else if (kind === 'goal') { var i = goals.map(function (g) { return g.id; }).indexOf(doc.id); if (i >= 0) goals[i] = doc; else goals.push(doc); await rawPut('goals', doc); }
  else { var j = projects.map(function (p) { return p.id; }).indexOf(doc.id); if (j >= 0) projects[j] = doc; else projects.push(doc); await rawPut('goals', doc); }
}
async function removeLocal(kind, id) {
  if (kind === 'entry') { delete entries[id]; await rawDel('entries', id); }
  else if (kind === 'goal') { goals = goals.filter(function (g) { return g.id !== id; }); await rawDel('goals', id); }
  else { projects = projects.filter(function (p) { return p.id !== id; }); await rawDel('goals', id); }
}
// две версии одной записи изменены на разных устройствах: ничего не теряем
async function resolveConflict(kind, local, remote, localWins) {
  var win = localWins ? local : remote, lose = localWins ? remote : local;
  if (kind === 'entry') {
    var m = { day: win.day, text: win.text || '', attachments: (win.attachments || []).slice(), rev: nextRev(Math.max(local.rev || 0, remote.rev || 0)) };
    var lt = (lose.text || '').trim();
    if (lt && lt !== m.text.trim()) m.text = (m.text ? m.text + '\n\n' : '') + '— запись с другого устройства —\n' + lose.text;
    (lose.attachments || []).forEach(function (a) { if (!m.attachments.some(function (z) { return z.id === a.id; })) m.attachments.push(a); });
    await applyDoc('entry', m); markDirty('entry', m.day); return 'entry';
  }
  if (kind === 'goal') {
    // объединяем: берём новую версию и добавляем задачи, которых в ней нет
    var ids = {}; (win.tasks || []).forEach(function (t) { ids[t.id] = 1; });
    (lose.tasks || []).forEach(function (t) { if (!ids[t.id]) win.tasks.push(t); });
    normalize(win.tasks);
  }
  win.rev = nextRev(Math.max(local.rev || 0, remote.rev || 0));
  await applyDoc(kind, win); markDirty(kind, win.id);
  return kind === 'goal' ? 'conflict' : 'project';
}

async function pullChanges() {
  var cursor = lsGet('sync-cursor', ''), first = !lsGet('sync-first', false), base = lsGet('sync-base', {}), dirty = lsGet('sync-dirty', {});
  var path = '/rest/v1/docs?select=kind,id,data,deleted,rev,updated_at&kind=neq.meta&order=updated_at.asc,kind.asc,id.asc&limit=200';
  if (cursor) path += '&updated_at=gte.' + encodeURIComponent(cursor);
  var rows = [], off = 0;
  for (;;) { var part = await (await sApi('GET', path + '&offset=' + off)).json(); rows = rows.concat(part); off += part.length; if (part.length < 200) break; }
  var changed = { entries: [], any: false, conflicts: 0 }, remoteKeys = {}, maxTs = cursor, cleared = [];
  for (var row of rows) {
    var key = row.kind + ':' + row.id, ldoc = localDoc(row.kind, row.id), lrev = ldoc ? (ldoc.rev || 0) : 0, isDirty = !!dirty[key];
    remoteKeys[key] = 1; if (row.updated_at > maxTs) maxTs = row.updated_at;
    if (row.deleted) {
      if (ldoc && !(isDirty && lrev > row.rev) && lrev <= row.rev) { await removeLocal(row.kind, row.id); changed.any = true; if (row.kind === 'entry') changed.entries.push(row.id); }
      base[key] = row.rev; continue;
    }
    if (ldoc && base[key] === row.rev && lrev === row.rev) continue;
    var rdoc = await decDoc(row.data); rdoc.rev = row.rev;
    if (!ldoc) { await resolveBlobs(row.kind, rdoc, null); await applyDoc(row.kind, rdoc); base[key] = row.rev; changed.any = true; if (row.kind === 'entry') changed.entries.push(row.id); continue; }
    var same = canon(plain(ldoc)) === canon(plain(rdoc));
    if (same) { ldoc.rev = row.rev; await rawPut(row.kind === 'entry' ? 'entries' : 'goals', ldoc); base[key] = row.rev; cleared.push(key); continue; }
    var localChanged = isDirty || (first && base[key] === undefined);
    if (!localChanged) { await resolveBlobs(row.kind, rdoc, ldoc); await applyDoc(row.kind, rdoc); base[key] = row.rev; changed.any = true; if (row.kind === 'entry') changed.entries.push(row.id); continue; }
    if (isDirty && base[key] === row.rev) continue;            // сервер не менялся с прошлого раза: наша версия новее
    if (row.kind === 'goal' && isTrivial('goal', ldoc)) { await resolveBlobs(row.kind, rdoc, ldoc); await applyDoc(row.kind, rdoc); base[key] = row.rev; changed.any = true; continue; }
    await resolveBlobs(row.kind, rdoc, ldoc);
    var res = await resolveConflict(row.kind, ldoc, rdoc, lrev > rdoc.rev);
    if (res === 'conflict' || res === 'entry') changed.conflicts++;
    base[key] = row.rev; changed.any = true; if (row.kind === 'entry') changed.entries.push(row.id);
  }
  if (first) {
    var mark = function (kind, id, d) { if (!remoteKeys[kind + ':' + id] && !isTrivial(kind, d)) { if (!d.rev) d.rev = Date.now(); markDirty(kind, id); } };
    Object.keys(entries).forEach(function (k) { mark('entry', k, entries[k]); });
    goals.forEach(function (g) { mark('goal', g.id, g); }); projects.forEach(function (p) { mark('project', p.id, p); });
    lsSet('sync-first', true);
  }
  lsSet('sync-base', base); if (maxTs) lsSet('sync-cursor', maxTs);
  var d2 = lsGet('sync-dirty', {}); cleared.forEach(function (k) { delete d2[k]; }); lsSet('sync-dirty', d2);
  return changed;
}
async function pushChanges() {
  var dirty = lsGet('sync-dirty', {}), tomb = lsGet('sync-tomb', {}), base = lsGet('sync-base', {}), up = lsGet('sync-blobs', {}), rows = [], sent = {}, skip = [];
  for (var key of Object.keys(dirty)) {
    var p = key.indexOf(':'), kind = key.slice(0, p), id = key.slice(p + 1), doc = localDoc(kind, id);
    if (!doc || (isTrivial(kind, doc) && base[key] === undefined)) { skip.push(key); continue; }
    if (!doc.rev) doc.rev = Date.now();
    for (var it of blobItems(kind, doc)) { if (!up[it.id]) { await uploadBlob(it); up[it.id] = 1; lsSet('sync-blobs', up); } }
    rows.push({ kind: kind, id: id, data: await encDoc(plain(doc)), deleted: false, rev: doc.rev }); sent[key] = doc.rev;
  }
  Object.keys(tomb).forEach(function (k) { var p = k.indexOf(':'); rows.push({ kind: k.slice(0, p), id: k.slice(p + 1), data: null, deleted: true, rev: tomb[k] }); sent[k] = tomb[k]; });
  if (rows.length) await upsertRows(rows);
  var d2 = lsGet('sync-dirty', {}), t2 = lsGet('sync-tomb', {});
  skip.forEach(function (k) { delete d2[k]; });
  Object.keys(sent).forEach(function (k) {
    var p = k.indexOf(':'), cd = localDoc(k.slice(0, p), k.slice(p + 1));
    if (d2[k] && cd && cd.rev === sent[k]) delete d2[k];
    if (t2[k] === sent[k]) delete t2[k];
    base[k] = sent[k];
  });
  lsSet('sync-dirty', d2); lsSet('sync-tomb', t2); lsSet('sync-base', base);
  return rows.length;
}
async function syncNow(manual) {
  if (!syncOn()) return;
  if (SY.busy) { SY.again = true; return; }
  SY.busy = true; SY.cfg = syncCfg(); syncStatus('Синхронизация…', null);
  try {
    await flush();
    await ensureToken();
    if (!SY.key) SY.key = await deriveSyncKey(SY.cfg);
    await verifyKey();
    var ch = await pullChanges(), n = await pushChanges();
    if (ch.any) {
      inbox();
      var ae = document.activeElement, typing = ae && /INPUT|TEXTAREA/.test(ae.tagName) && ae.value && ae.id !== 'q';
      if (typing) setTimeout(renderAll, 6000); else renderAll();
      if (nav.v === 'diary' && ch.entries.indexOf(sel) >= 0 && !pend) { show(); list(); }
    }
    var t = new Date(); lsSet('sync-last', t.toISOString());
    syncStatus('Синхронизировано в ' + pad2(t.getHours()) + ':' + pad2(t.getMinutes()) + (ch.conflicts ? ' · данные с двух устройств объединены' : ''), true);
    if (ch.conflicts) toast('Одни и те же данные изменились на двух устройствах. Ничего не потеряно: изменения объединены.');
  } catch (e) {
    var msg = (e && e.message) || String(e);
    if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) msg = 'нет связи с сервером, повторю позже';
    syncStatus('Ошибка синхронизации: ' + msg, false);
    if (!/нет связи/.test(msg)) SY.key = null;
  } finally {
    SY.busy = false;
    if (SY.again) { SY.again = false; scheduleSync(1500); }
  }
}
function syncDisconnect() {
  ['sync-cfg', 'sync-dirty', 'sync-tomb', 'sync-base', 'sync-cursor', 'sync-first', 'sync-blobs', 'sync-last'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
  SY.tok = ''; SY.key = null; SY.cfg = null; syncStatus('', null); var d = $('sdot'); if (d) d.hidden = true;
}
async function syncConnect(mode, f) {
  var url = f.url.trim().replace(/\/+$/, ''), key = f.key.trim(), email = f.email.trim();
  var msg = function (t) { var s = $('syncst'); if (s) s.textContent = t; };
  if (!/^https:\/\/.+/.test(url) || !key || !email || !f.pass || !f.enc) { msg('Заполните все поля (адрес проекта начинается с https://).'); return; }
  if (f.enc.length < 6) { msg('Пароль шифрования: минимум 6 символов.'); return; }
  msg('Подключаюсь…');
  try {
    var j = await sAuth(mode, url, key, email, f.pass);
    if (!j.access_token) { msg('Аккаунт создан. Подтвердите почту по письму от Supabase и нажмите «Войти». (Чтобы письма не требовались: Supabase → Authentication → Sign In / Providers → Email → выключите «Confirm email».)'); return; }
    ['sync-dirty', 'sync-tomb', 'sync-base', 'sync-cursor', 'sync-first', 'sync-blobs'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
    lsSet('sync-cfg', { url: url, key: key, email: email, refresh: j.refresh_token, uid: j.user.id, pass: f.enc });
    lsSet('sync-form', { url: url, key: key, email: email });
    SY.cfg = syncCfg(); SY.tok = j.access_token; SY.exp = Date.now() + (j.expires_in || 3600) * 1000 - 60000; SY.key = null;
    renderSettings(); syncNow(true);
  } catch (e) { msg('Ошибка: ' + ((e && e.message) || e)); }
}
function syncCard() {
  var c = el('div', 'card'), cfg = syncCfg();
  c.appendChild(el('div', 'lbl', '☁️ Синхронизация между устройствами'));
  var st = el('div', 'hint'); st.id = 'syncst'; st.style.margin = '8px 0'; st.textContent = SY.status || '';
  if (syncOn()) {
    c.appendChild(el('div', 'hint', '✅ Подключено: ' + cfg.email));
    c.appendChild(st);
    var bar = el('div', 'bar'), b1 = el('button', 'b', '🔄 Синхронизировать сейчас'), b2 = el('button', 'b', 'Отключить');
    b1.onclick = function () { syncNow(true); };
    b2.onclick = async function () { if (await ask('Отключить синхронизацию на этом устройстве? Данные останутся и здесь, и в облаке.', 'Отключить')) { syncDisconnect(); renderSettings(); } };
    bar.appendChild(b1); bar.appendChild(b2); c.appendChild(bar);
    c.appendChild(el('div', 'hint', 'Данные шифруются на устройстве: пароль шифрования знаете только вы. Если его забыть, данные из облака не восстановить. Синхронизация идёт сама: после изменений, при открытии программы и раз в минуту.'));
    return c;
  }
  var form = lsGet('sync-form', {});
  c.appendChild(el('div', 'hint', 'Записи, задачи и вложения будут одинаковыми на всех ваших устройствах. Нужен бесплатный проект Supabase (инструкция: файл «Синхронизация.txt» рядом с программой).'));
  function fld(ph, val, pwd) { var i = el('input', 'fld'); i.type = pwd ? 'password' : 'text'; i.placeholder = ph; i.value = val || ''; i.autocomplete = 'off'; i.style.maxWidth = 'none'; i.style.marginTop = '8px'; c.appendChild(i); return i; }
  var u = fld('Адрес проекта: https://xxxx.supabase.co', form.url), k = fld('Публичный ключ (anon / publishable key)', form.key), e = fld('Email', form.email);
  var p = fld('Пароль аккаунта', '', true), z = fld('Пароль шифрования (одинаковый на всех устройствах)', '', true);
  c.appendChild(st);
  var bar2 = el('div', 'bar'), lg = el('button', 'b act', 'Войти'), su = el('button', 'b', 'Создать аккаунт');
  var get = function () { return { url: u.value, key: k.value, email: e.value, pass: p.value, enc: z.value }; };
  lg.onclick = function () { syncConnect('login', get()); }; su.onclick = function () { syncConnect('signup', get()); };
  bar2.appendChild(lg); bar2.appendChild(su); c.appendChild(bar2);
  c.appendChild(el('div', 'hint', 'Первое устройство: нажмите «Создать аккаунт». Остальные устройства: те же данные и «Войти».'));
  return c;
}

(async function () {
  initLock();
  var t = new Date(); sel = key(t); view = new Date(t.getFullYear(), t.getMonth(), 1);
  inbox(); show(); list(); renderAll();
  try {
    db = await idb();
    (await dbAll()).forEach(function (e) { entries[e.day] = e; });
    var all = await gAll();
    goals = all.filter(function (x) { return x.kind !== 'project'; }); projects = all.filter(function (x) { return x.kind === 'project'; });
    inbox();
    $('err').hidden = true;
    show(); list(); renderAll(); remindTick();
    if (syncOn()) { SY.cfg = syncCfg(); syncStatus('Подключено', null); scheduleSync(800); }
  } catch (e) { storageErr(e); }
  $('sdot').onclick = function () { go('settings'); };
  setInterval(function () { if (syncOn()) syncNow(false); }, 60000);
  window.addEventListener('focus', function () { if (syncOn()) scheduleSync(1500); });
})();
